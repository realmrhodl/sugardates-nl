    .chip{appearance:none;background:#fff;color:#343a40;font-weight:600;font-size:13px;font-family:Poppins,sans-serif;border-radius:1.125rem;border:2px solid #dfe4f1;box-shadow:0 0 .5rem 0 #e3e4e5;padding:.55rem .95rem;min-height:44px;cursor:pointer;transition:background .15s,color .15s,border-color .15s,transform .15s}
    .chip:hover,.chip:focus-visible{border-color:#7351c0;color:#7351c0}
    button.chip.is-on{border-color:#7351c0;background:#7351c0;color:#fff;transform:scale(1.03)}
    #panel h1:focus{outline:none}
    .actions{margin-top:1.15rem;display:flex;flex-wrap:wrap;gap:.6rem}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .summary{margin:1rem 0 0;padding:0;list-style:none}
    .summary li{display:flex;gap:.75rem;padding:.55rem 0;border-top:1px solid #dfe4f1;font-size:13px;line-height:1.5}

    .step-panel{width:100%}
    @media (prefers-reduced-motion:reduce){
      .progress-fill,.role-card,.chip,.btn,.pd-cta{transition:none!important}

  <script>
  (function () {
    // Front-end demo only. Nothing is sent to a server.
    // Answers + e-mail may be saved in localStorage as a placeholder waitlist.
    // The password is NEVER written to localStorage, sessionStorage, cookies, or the network.
    var STORAGE_KEY = "sugardates-v4-funnel-demo";
    var YEAR_MAX = 2005; // 21+ in 2026; 21+ is also confirmed later with a checkbox
    var YEAR_MIN = 1946;

    var STEPS = ["role","looking","intent","values","arrangement","location","age","name","bio","account"];

    var LOOKING = [
      {id:"sugardaddy", label:"Een sugardaddy"},
      {id:"sugarmama", label:"Een sugarmama"},
      {id:"sugarbaby", label:"Een sugarbaby"},
      {id:"any", label:"Dat maakt me niet uit"}
    ];
    var INTENTS = [
      {id:"langdurig", label:"Een langdurige regeling"},
      {id:"afentoe", label:"Af en toe afspreken"},
      {id:"mentor", label:"Mentorschap"},
      {id:"reizen", label:"Samen reizen"},
      {id:"chatten", label:"Gewoon eerst chatten"}
    ];
    var VALUES = [
      {id:"discretie", label:"Discretie"},
      {id:"chemie", label:"Chemie"},
      {id:"afspraken", label:"Duidelijke afspraken"},
      {id:"grenzen", label:"Respect voor grenzen"},
      {id:"eerlijk", label:"Eerlijkheid"}
    ];
    var ARRANGEMENTS = [
      {id:"online-eerst", label:"Eerst online kennismaken"},
      {id:"open", label:"Open communicatie over verwachtingen"},
      {id:"publiek", label:"Een eerste afspraak in het openbaar"},
      {id:"tempo", label:"In elkaars tempo, zonder haast"},
      {id:"nog-niet", label:"Dat zoek ik nog uit"}
    ];
    var CITIES = ["Amsterdam","Rotterdam","Den Haag","Utrecht","Eindhoven","Groningen","Almere","Tilburg","Breda","Nijmegen","Arnhem","Apeldoorn","Haarlem","Haarlemmermeer","Zaanstad","Amersfoort","Enschede","Den Bosch","Zwolle","Zoetermeer","Leiden","Leeuwarden","Maastricht","Ede","Dordrecht","Westland","Alphen aan den Rijn","Alkmaar","Delft","Emmen","Deventer","Venlo"];
    var PROVINCES = ["Drenthe","Flevoland","Friesland","Gelderland","Groningen","Limburg","Noord-Brabant","Noord-Holland","Overijssel","Utrecht","Zeeland","Zuid-Holland"];

    var state = {
      role: "",
      lookingFor: "",
      intents: [],
      values: [],
      arrangements: [],
      location: "",
      birthYear: "",
      displayName: "",
      oneLiner: "",
      email: "",
      completed: false
    };
    var stepIndex = 0;
    var onSuccess = false;

    var panel = document.getElementById("panel");
    var backBtn = document.getElementById("back-btn");
    var stepCount = document.getElementById("step-count");
    var progressFill = document.getElementById("progress-fill");
    var live = document.getElementById("step-live");
    var ageLine = document.getElementById("age-line");

    function reduceMotion() {
      return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    }
    function escapeHtml(str) {
      return String(str == null ? "" : str)
        .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
    }
    function labelOf(list, id) {
      for (var i=0;i<list.length;i++) if (list[i].id===id) return list[i].label;
      return id;
    }
    function labelsOf(list, ids) {
      return (ids||[]).map(function(id){ return labelOf(list,id); });
    }
    function roleLabel() {
      if (state.role === "baby") return "sugarbaby";
      if (state.role === "daddy") return "sugardaddy of sugarmama";
      return "";
    }
    function lookingLabel() {
      if (state.lookingFor === "sugardaddy") return "een sugardaddy";
      if (state.lookingFor === "sugarmama") return "een sugarmama";
      if (state.lookingFor === "sugarbaby") return "een sugarbaby";
      return "";
    }
    function personalLead() {
      var who = lookingLabel();
      if (who) {
        var extra = "";
        if (state.intents.indexOf("langdurig") >= 0) extra = " die past bij een langdurige regeling";
        else if (state.intents.indexOf("chatten") >= 0) extra = ", en dat je eerst wilt chatten";
        else if (state.intents.indexOf("mentor") >= 0) extra = ", met ruimte voor mentorschap";
        return "Fijn dat je " + who + " zoekt" + extra + ".";
      }
      if (state.role === "baby") return "Fijn dat je je als sugarbaby aanmeldt.";
      if (state.role === "daddy") return "Fijn dat je je als sugardaddy of sugarmama aanmeldt.";
      return "";
    }

    function remainingText() {
      if (onSuccess) return "";
      var left = STEPS.length - stepIndex - 1;
      if (left <= 0) return "Laatste stap";
      if (left === 1) return "Nog 1 vraag";
      return "Nog " + left + " vragen";
    }

    function saveAnswers() {
      // Placeholder only: no backend. Never includes a password.
      try {
        var copy = {
          role: state.role,
          lookingFor: state.lookingFor,
          intents: state.intents.slice(),
          values: state.values.slice(),
          arrangements: state.arrangements.slice(),
          location: state.location,
          birthYear: state.birthYear,
          displayName: state.displayName,
          oneLiner: state.oneLiner,
          email: state.email,
          completed: state.completed,
          stepIndex: Math.min(stepIndex, STEPS.length - 1),
          onSuccess: onSuccess
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(copy));
      } catch (e) {}
    }
    function loadAnswers() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        var data = JSON.parse(raw);
        if (!data || typeof data !== "object") return;
        ["role","lookingFor","location","birthYear","displayName","oneLiner","email"].forEach(function(k){
          if (typeof data[k] === "string") state[k] = data[k];
        });
        ["intents","values","arrangements"].forEach(function(k){
          if (Array.isArray(data[k])) state[k] = data[k].filter(function(x){ return typeof x === "string"; });
        });
        state.completed = !!data.completed;
        if (state.completed) { onSuccess = true; stepIndex = STEPS.length - 1; }
        else if (typeof data.stepIndex === "number" && data.stepIndex >= 0 && data.stepIndex < STEPS.length) {
          stepIndex = data.stepIndex;
        }
      } catch (e) {}
    }

    function updateChrome() {
      var total = STEPS.length;
      var current = onSuccess ? total : stepIndex + 1;
      progressFill.style.width = Math.round((current / total) * 100) + "%";
      backBtn.hidden = onSuccess || stepIndex === 0;
      if (onSuccess) {
        stepCount.textContent = "Aanmelding ontvangen";
      } else {
        stepCount.textContent = "Stap " + current + " van " + total + " · " + remainingText();
      }
      ageLine.hidden = onSuccess;
    }

    function announce(title) {
      var text = onSuccess ? title : ("Stap " + (stepIndex + 1) + " van " + STEPS.length + ": " + title);
      live.textContent = text;
    }

    function focusHeading() {
      var h = panel.querySelector("h1");
      if (!h) return;
      h.setAttribute("tabindex", "-1");
      try { h.focus({preventScroll: true}); } catch (e) { h.focus(); }
    }

    function toggleIn(arr, id) {
      var i = arr.indexOf(id);
      if (i >= 0) arr.splice(i, 1);
      else arr.push(id);
      return arr;
    }

    function chipsHtml(list, selected) {
      return '<div class="chips" role="group">' + list.map(function(item){
        var on = selected.indexOf(item.id) >= 0;
        return '<button type="button" class="chip' + (on ? ' is-on' : '') + '" data-chip="' + item.id + '" aria-pressed="' + (on ? "true" : "false") + '">' + escapeHtml(item.label) + '</button>';
      }).join("") + "</div>";
    }

    function optionsHtml(values, current, placeholder) {
      var html = '<option value="">' + escapeHtml(placeholder) + "</option>";
      values.forEach(function(v){
        html += '<option value="' + escapeHtml(v) + '"' + (current===v ? " selected" : "") + ">" + escapeHtml(v) + "</option>";
      });
      return html;
    }

    function render() {
      updateChrome();
      var html = "";
      if (onSuccess) html = renderSuccess();
      else html = renderStep(STEPS[stepIndex]);
      panel.innerHTML = html;
      bindStep();
      focusHeading();
    }

    function renderStep(id) {
      var lead = personalLead();
      var leadHtml = lead ? '<p class="personal">' + escapeHtml(lead) + "</p>" : "";
      if (id === "role") {
        return (
          '<h1 class="text-[24px] sm:text-[28px] font-bold text-[#212529] leading-tight">Wie ben je op SugarDates?</h1>' +
          '<p class="lead">Kies wat het beste bij je past. Je kunt je antwoord later nog aanpassen.</p>' +
          '<div class="role-grid">' +
            '<button type="button" class="role-card' + (state.role==="daddy"?" is-on":"") + '" data-role="daddy">' +
              '<span class="role-kicker">Genereus</span>' +
              '<span class="role-title">Ik ben sugardaddy of sugarmama</span>' +
              '<span class="role-text">Je zoekt gezelschap en wilt daar open over zijn, met duidelijke afspraken.</span>' +
            '</button>' +
            '<button type="button" class="role-card' + (state.role==="baby"?" is-on":"") + '" data-role="baby">' +
              '<span class="role-kicker">Op jouw voorwaarden</span>' +
              '<span class="role-title">Ik ben sugarbaby</span>' +
              '<span class="role-text">Je zoekt iemand die ruimhartig is en duidelijk communiceert. Jij bepaalt je grenzen.</span>' +
            '</button>' +
          '</div>' +
          '<p class="micro">SugarDates is gemaakt voor Nederland. Geen haast, geen vast script.</p>' +
          '<p class="err" id="err" hidden></p>'
        );
      }
      if (id === "looking") {
        return leadHtml +
          '<h1 class="text-[24px] sm:text-[28px] font-bold text-[#212529] leading-tight">Wie zoek je?</h1>' +
          '<p class="lead">Dan stemmen we de volgende vragen daarop af.</p>' +
          chipsHtml(LOOKING, state.lookingFor ? [state.lookingFor] : []) +
          '<p class="micro">Je kunt dit later nog wijzigen.</p>' +
          '<p class="err" id="err" hidden></p>' +
          '<div class="actions"><button type="button" class="btn btn-pd" data-next>Verder</button></div>';
      }
      if (id === "intent") {
        return leadHtml +
          '<h1 class="text-[24px] sm:text-[28px] font-bold text-[#212529] leading-tight">Wat zoek je?</h1>' +
          '<p class="lead">Kies wat bij je past. Meerdere antwoorden mag.</p>' +
          chipsHtml(INTENTS, state.intents) +
          '<p class="err" id="err" hidden></p>' +
          '<div class="actions"><button type="button" class="btn btn-pd" data-next>Verder</button></div>';
      }
      if (id === "values") {
        return leadHtml +
          '<h1 class="text-[24px] sm:text-[28px] font-bold text-[#212529] leading-tight">Wat is belangrijk voor jou?</h1>' +
          '<p class="lead">Dit helpt om verwachtingen helder te krijgen. Kies gerust meer dan één.</p>' +
          chipsHtml(VALUES, state.values) +
          '<p class="err" id="err" hidden></p>' +
          '<div class="actions"><button type="button" class="btn btn-pd" data-next>Verder</button></div>';
      }
      if (id === "arrangement") {
        return leadHtml +
          '<h1 class="text-[24px] sm:text-[28px] font-bold text-[#212529] leading-tight">Wat voor regeling past bij jou?</h1>' +
          '<p class="lead">Hoe wil je het liefst beginnen? Jullie spreken samen af hoe het verder gaat.</p>' +
          chipsHtml(ARRANGEMENTS, state.arrangements) +
          '<p class="micro">Niets is verplicht. Een regeling is wat jullie zelf overeenkomen.</p>' +
          '<p class="err" id="err" hidden></p>' +
          '<div class="actions"><button type="button" class="btn btn-pd" data-next>Verder</button></div>';
      }
      if (id === "location") {
        return leadHtml +
          '<h1 class="text-[24px] sm:text-[28px] font-bold text-[#212529] leading-tight">Waar woon je?</h1>' +
          '<p class="lead">Een stad of provincie is genoeg. Geen adres.</p>' +
          '<label class="lbl mt-4" for="location">Stad of provincie</label>' +
          '<select id="location" class="inp" required>' +
            '<option value="">Kies een stad of provincie</option>' +
            '<optgroup label="Grote steden">' + optionsHtml(CITIES, state.location, "").replace('<option value=""></option>',"") + "</optgroup>" +
            '<optgroup label="Provincies">' + optionsHtml(PROVINCES, state.location, "").replace('<option value=""></option>',"") + "</optgroup>" +
            '<optgroup label="Anders"><option value="Ergens anders in Nederland"' + (state.location==="Ergens anders in Nederland"?" selected":"") + '>Ergens anders in Nederland</option></optgroup>' +
          '</select>' +
          '<p class="micro">We gebruiken dit alleen om je aanmelding te plaatsen, niet om je te achterhalen.</p>' +
          '<p class="err" id="err" hidden></p>' +
          '<div class="actions"><button type="button" class="btn btn-pd" data-next>Verder</button></div>';
      }
      if (id === "age") {
        var years = [];
        for (var y = YEAR_MAX; y >= YEAR_MIN; y--) years.push(String(y));
        return leadHtml +
          '<h1 class="text-[24px] sm:text-[28px] font-bold text-[#212529] leading-tight">Wat is je geboortejaar?</h1>' +
          '<p class="lead">SugarDates is alleen voor mensen van 21 jaar of ouder.</p>' +
          '<label class="lbl mt-4" for="birthYear">Geboortejaar</label>' +
          '<select id="birthYear" class="inp" required>' + optionsHtml(years, state.birthYear, "Kies je geboortejaar") + "</select>" +
          '<p class="micro">Je bevestigt je leeftijd later nog een keer, bij het afronden.</p>' +
          '<p class="err" id="err" hidden></p>' +
          '<div class="actions"><button type="button" class="btn btn-pd" data-next>Verder</button></div>';
      }
      if (id === "name") {
        return leadHtml +
          '<h1 class="text-[24px] sm:text-[28px] font-bold text-[#212529] leading-tight">Hoe mogen we je noemen?</h1>' +
          '<p class="lead">Een pseudoniem is welkom. Je echte naam is niet nodig.</p>' +
          '<label class="lbl mt-4" for="displayName">Weergavenaam</label>' +
          '<input id="displayName" class="inp" name="displayName" type="text" maxlength="32" autocomplete="nickname" required placeholder="Bijvoorbeeld een voornaam of bijnaam" value="' + escapeHtml(state.displayName) + '">' +
          '<p class="micro">Je bepaalt zelf wat je deelt. Dit is voor je profiel als de site live gaat, niet voor een paspoort.</p>' +
          '<p class="err" id="err" hidden></p>' +
          '<div class="actions"><button type="button" class="btn btn-pd" data-next>Verder</button></div>';
      }
      if (id === "bio") {
        return leadHtml +
          '<h1 class="text-[24px] sm:text-[28px] font-bold text-[#212529] leading-tight">Waar ben je naar op zoek?</h1>' +
          '<p class="lead">Kort, in je eigen woorden. Dit mag je overslaan.</p>' +
          '<label class="lbl mt-4" for="oneLiner">Korte omschrijving <span class="font-normal text-ink-muted">(niet verplicht)</span></label>' +
          '<textarea id="oneLiner" class="inp" name="oneLiner" rows="3" maxlength="140" placeholder="Wat zoek je, en hoe wil je het aanpakken?">' + escapeHtml(state.oneLiner) + "</textarea>" +
          '<p class="micro">Maximaal 140 tekens. Je kunt dit later nog aanpassen.</p>' +
          '<p class="err" id="err" hidden></p>' +
          '<div class="actions">' +
            '<button type="button" class="btn btn-pd" data-next>Verder</button>' +
            '<button type="button" class="btn btn-ghost" data-skip>Overslaan</button>' +
          "</div>";
      }
      if (id === "account") {
        return leadHtml +
          '<h1 class="text-[24px] sm:text-[28px] font-bold text-[#212529] leading-tight">Rond je aanmelding af</h1>' +
          '<p class="lead">Je antwoorden staan klaar. Alleen nog een e-mailadres en een wachtwoord. SugarDates is nog niet live; we zetten je op de lijst.</p>' +
          '<form id="account-form" novalidate>' +
            '<div class="mt-4"><label class="lbl" for="email">E-mailadres</label>' +
            '<input id="email" class="inp" name="email" type="email" autocomplete="email" inputmode="email" required placeholder="jij@email.nl" value="' + escapeHtml(state.email) + '"></div>' +
            '<div class="mt-3"><label class="lbl" for="password">Wachtwoord</label>' +
            '<input id="password" class="inp" name="password" type="password" autocomplete="new-password" minlength="8" required placeholder="Minimaal 8 tekens"></div>' +
            '<p class="micro">Kies een wachtwoord dat je later kunt gebruiken, als de site live gaat. In deze aanmelding wordt je wachtwoord niet opgeslagen.</p>' +
            '<label class="flex items-start gap-2.5 text-[14px] text-ink font-medium leading-snug cursor-pointer mt-4">' +
              '<input id="age" name="age" type="checkbox" class="chk" required>' +
              '<span>Ik ben 21 jaar of ouder</span>' +
            "</label>" +
            '<label class="flex items-start gap-2.5 text-[14px] text-ink font-medium leading-snug cursor-pointer mt-3">' +
              '<input id="terms" name="terms" type="checkbox" class="chk" required>' +
              '<span>Ik ga akkoord met de <a href="#" class="text-pd">voorwaarden</a> en het <a href="#" class="text-pd">privacybeleid</a></span>' +
            "</label>" +
            '<p class="err" id="err" hidden></p>' +
            '<div class="actions"><button type="submit" class="btn btn-pd w-full sm:w-auto">Zet me op de lijst</button></div>' +
          "</form>";
      }
      return "";
    }

    function renderSuccess() {
      var name = state.displayName || "je";
      var rows = [
        ["Rol", state.role === "baby" ? "Sugarbaby" : "Sugardaddy of sugarmama"],
        ["Op zoek naar", lookingLabel() ? lookingLabel() : "Niet ingevuld"],
        ["Wat je zoekt", labelsOf(INTENTS, state.intents).join(", ") || "—"],
        ["Belangrijk", labelsOf(VALUES, state.values).join(", ") || "—"],
        ["Regeling", labelsOf(ARRANGEMENTS, state.arrangements).join(", ") || "—"],
        ["Woont in", state.location || "—"],
        ["Geboortejaar", state.birthYear || "—"],
        ["Weergavenaam", state.displayName || "—"]
      ];
      if (state.oneLiner) rows.push(["In eigen woorden", state.oneLiner]);
      if (state.email) rows.push(["E-mail", state.email]);
      var list = rows.map(function(row){
        return '<li><span class="k">' + escapeHtml(row[0]) + '</span><span class="v">' + escapeHtml(row[1]) + "</span></li>";
      }).join("");
      return (
        '<h1 class="text-[24px] sm:text-[28px] font-bold text-[#212529] leading-tight">Je staat op de lijst, ' + escapeHtml(name) + '.</h1>' +
        '<p class="lead">Bedankt. Als SugarDates live gaat, hoor je van ons op ' + escapeHtml(state.email || "je e-mailadres") + ".</p>" +
        '<div class="block p-4 sm:p-5 mt-4"><h2 class="text-[15px] font-bold text-[#212529] m-0">Jouw aanmelding</h2><ul class="summary">' + list + "</ul></div>" +
        '<h2 class="text-[15px] font-bold text-[#212529] mt-5 mb-0">Wat er nu gebeurt</h2>' +
        '<ul class="next-list">' +
          '<li><span class="n">1</span><span>Je staat op de early-accesslijst. Er is nog geen live account.</span></li>' +
          '<li><span class="n">2</span><span>Bij livegang vragen we je je e-mail te bevestigen.</span></li>' +
          '<li><span class="n">3</span><span>Verificatie van profielen en online chatten komen er bij de livegang bij. Melden van profielen ook. Je bepaalt zelf wat je deelt.</span></li>' +
        "</ul>" +
        '<div class="actions">' +
          '<button type="button" class="btn btn-pd" id="share-btn">Deel met een vriend of vriendin</button>' +
          '<button type="button" class="btn btn-ghost" id="reset-btn">Nieuwe aanmelding</button>' +
        "</div>" +
        '<p class="micro" id="share-status" hidden></p>'
      );
    }

    function showError(msg, focusEl) {
      var err = document.getElementById("err");
      if (!err) return;
      err.hidden = false;
      err.textContent = msg;
      if (focusEl) {
        focusEl.setAttribute("aria-invalid", "true");
        focusEl.focus();
      }
    }
    function clearError() {
      var err = document.getElementById("err");
      if (err) { err.hidden = true; err.textContent = ""; }
    }

    function go(delta) {
      if (onSuccess) return;
      var next = stepIndex + delta;
      if (next < 0 || next >= STEPS.length) return;
      stepIndex = next;
      saveAnswers();
      render();
      announce(panel.querySelector("h1") ? panel.querySelector("h1").textContent : "");
    }

    function finish() {
      state.completed = true;
      onSuccess = true;
      saveAnswers();
      render();
      announce("Je staat op de lijst");
    }

    function validEmail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    }

    function bindStep() {
      var id = onSuccess ? "success" : STEPS[stepIndex];

      panel.querySelectorAll("[data-role]").forEach(function(btn){
        btn.addEventListener("click", function(){
          state.role = btn.getAttribute("data-role");
          panel.querySelectorAll("[data-role]").forEach(function(b){ b.classList.toggle("is-on", b===btn); });
          saveAnswers();
          window.setTimeout(function(){ go(1); }, reduceMotion() ? 0 : 180);
        });
      });

      panel.querySelectorAll("[data-chip]").forEach(function(btn){
        btn.addEventListener("click", function(){
          var cid = btn.getAttribute("data-chip");
          if (id === "looking") {
            state.lookingFor = (state.lookingFor === cid) ? "" : cid;
            panel.querySelectorAll("[data-chip]").forEach(function(b){
              var on = b.getAttribute("data-chip") === state.lookingFor;
              b.classList.toggle("is-on", on);
              b.setAttribute("aria-pressed", on ? "true" : "false");
            });
          } else if (id === "intent") {
            toggleIn(state.intents, cid);
            btn.classList.toggle("is-on", state.intents.indexOf(cid)>=0);
            btn.setAttribute("aria-pressed", state.intents.indexOf(cid)>=0 ? "true" : "false");
          } else if (id === "values") {
            toggleIn(state.values, cid);
            btn.classList.toggle("is-on", state.values.indexOf(cid)>=0);
            btn.setAttribute("aria-pressed", state.values.indexOf(cid)>=0 ? "true" : "false");
          } else if (id === "arrangement") {
            toggleIn(state.arrangements, cid);
            btn.classList.toggle("is-on", state.arrangements.indexOf(cid)>=0);
            btn.setAttribute("aria-pressed", state.arrangements.indexOf(cid)>=0 ? "true" : "false");
          }
          clearError();
        });
      });

      var nextBtn = panel.querySelector("[data-next]");
      if (nextBtn) nextBtn.addEventListener("click", onNext);
      var skipBtn = panel.querySelector("[data-skip]");
      if (skipBtn) skipBtn.addEventListener("click", function(){
        if (id === "bio") state.oneLiner = "";
        go(1);
      });

      var loc = document.getElementById("location");
      if (loc) loc.addEventListener("change", function(){ state.location = loc.value; clearError(); });
      var year = document.getElementById("birthYear");
      if (year) year.addEventListener("change", function(){ state.birthYear = year.value; clearError(); });
      var name = document.getElementById("displayName");
      if (name) name.addEventListener("input", function(){ state.displayName = name.value; });
      var bio = document.getElementById("oneLiner");
      if (bio) bio.addEventListener("input", function(){ state.oneLiner = bio.value; });

      var form = document.getElementById("account-form");
      if (form) form.addEventListener("submit", onAccount);

      var share = document.getElementById("share-btn");
      if (share) share.addEventListener("click", onShare);
      var reset = document.getElementById("reset-btn");
      if (reset) reset.addEventListener("click", onReset);

      ["location","birthYear","displayName","oneLiner","email","password"].forEach(function(fid){
        var el = document.getElementById(fid);
        if (!el) return;
        el.addEventListener("keydown", function(ev){
          if (ev.key === "Enter" && fid !== "oneLiner" && id !== "account") {
            ev.preventDefault();
            onNext();
          }
        });
      });
    }

    function onNext() {
      clearError();
      var id = STEPS[stepIndex];
      if (id === "looking") {
        if (!state.lookingFor) return showError("Kies wie je zoekt om verder te gaan.");
        return go(1);
      }
      if (id === "intent") {
        if (!state.intents.length) return showError("Kies minstens één optie om verder te gaan.");
        return go(1);
      }
      if (id === "values") {
        if (!state.values.length) return showError("Kies minstens één optie die voor jou belangrijk is.");
        return go(1);
      }
      if (id === "arrangement") {
        if (!state.arrangements.length) return showError("Kies hoe je het liefst wilt beginnen.");
        return go(1);
      }
      if (id === "location") {
        var loc = document.getElementById("location");
        state.location = loc ? loc.value : state.location;
        if (!state.location) return showError("Kies een stad of provincie.", loc);
        return go(1);
      }
      if (id === "age") {
        var yearEl = document.getElementById("birthYear");
        state.birthYear = yearEl ? yearEl.value : state.birthYear;
        var year = parseInt(state.birthYear, 10);
        if (!year || year < YEAR_MIN || year > YEAR_MAX) {
          return showError("Kies een geboortejaar. Je moet 21 jaar of ouder zijn.", yearEl);
        }
        return go(1);
      }
      if (id === "name") {
        var nameEl = document.getElementById("displayName");
        state.displayName = nameEl ? nameEl.value.trim() : state.displayName.trim();
        if (!state.displayName) return showError("Vul een weergavenaam in. Een bijnaam of pseudoniem is prima.", nameEl);
        return go(1);
      }
      if (id === "bio") {
        var bioEl = document.getElementById("oneLiner");
        state.oneLiner = bioEl ? bioEl.value.trim() : state.oneLiner.trim();
        return go(1);
      }
    }

    function onAccount(ev) {
      ev.preventDefault();
      clearError();
      var emailEl = document.getElementById("email");
      var passEl = document.getElementById("password");
      var ageEl = document.getElementById("age");
      var termsEl = document.getElementById("terms");
      var email = emailEl ? emailEl.value.trim() : "";
      var password = passEl ? passEl.value : "";
      if (!validEmail(email)) return showError("Vul een geldig e-mailadres in.", emailEl);
      if (!password || password.length < 8) return showError("Gebruik minstens 8 tekens voor je wachtwoord.", passEl);
      if (!ageEl || !ageEl.checked) return showError("Bevestig dat je 21 jaar of ouder bent.", ageEl);
      if (!termsEl || !termsEl.checked) return showError("Om je aan te melden, ga je akkoord met de voorwaarden en het privacybeleid.", termsEl);
      state.email = email;
      // Intentionally discard the password. Do not persist it anywhere.
      password = "";
      if (passEl) passEl.value = "";
      finish();
    }

    function onShare() {
      var url = window.location.href.split("#")[0];
      var status = document.getElementById("share-status");
      function ok() {
        if (status) { status.hidden = false; status.textContent = "Link gekopieerd. Je kunt hem plakken in een bericht."; }
        var btn = document.getElementById("share-btn");
        if (btn) btn.textContent = "Link gekopieerd";
      }
      function fail() {
        if (status) { status.hidden = false; status.textContent = "Kopieer deze link zelf: " + url; }
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(ok).catch(fail);
      } else {
        fail();
      }
    }

    function onReset() {
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      state = {role:"",lookingFor:"",intents:[],values:[],arrangements:[],location:"",birthYear:"",displayName:"",oneLiner:"",email:"",completed:false};
      stepIndex = 0;
      onSuccess = false;
      render();
      announce("Wie ben je op SugarDates?");
    }

    backBtn.addEventListener("click", function(){ go(-1); });

    loadAnswers();
    render();
    announce(panel.querySelector("h1") ? panel.querySelector("h1").textContent : "Aanmelden");
  })();
  </script>
</body>
</html>
